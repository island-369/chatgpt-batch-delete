<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0;padding:16px;background:#2b2b2b;display:flex;gap:20px;align-items:flex-start;font:12px/1.4 sans-serif;color:#aaa}
  .box{display:flex;flex-direction:column;gap:8px}
  .big{width:240px;height:240px;image-rendering:pixelated}
  .real{width:16px;height:16px;image-rendering:pixelated;border:1px solid #555}
</style></head><body>
  <div class="box"><div>16px 原尺寸</div><img class="real" src="../icons/icon16.png"></div>
  <div class="box"><div>16px 放大 15 倍（看抗锯齿与形状）</div><img class="big" src="../icons/icon16.png"></div>
  <div class="box"><div>48px 放大 5 倍</div><img class="big" src="../icons/icon48.png"></div>
</body></html>
