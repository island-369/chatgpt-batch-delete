<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
  <!-- 48 / 128 用完整版：渐变底、内侧高光、投影、三条槽位 -->
  <svg id="detailed" viewBox="0 0 128 128" width="0" height="0" style="display:none">
    <defs>
      <linearGradient id="bgGrad" x1="14" y1="4" x2="116" y2="126" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#19c49b"/>
        <stop offset="0.52" stop-color="#0d9a76"/>
        <stop offset="1" stop-color="#066b52"/>
      </linearGradient>
      <radialGradient id="bgGlow" cx="46" cy="10" r="96" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <filter id="binShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="3.4" stdDeviation="4" flood-color="#032b22" flood-opacity="0.45"/>
      </filter>
      <mask id="binSlots">
        <rect width="128" height="128" fill="#fff"/>
        <rect x="49.5" y="58.6" width="6.4" height="36" rx="3.2" fill="#000"/>
        <rect x="61.3" y="58.6" width="6.4" height="36" rx="3.2" fill="#000"/>
        <rect x="73.1" y="58.6" width="6.4" height="36" rx="3.2" fill="#000"/>
      </mask>
    </defs>

    <!-- 底 -->
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
    <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
    <rect x="1.6" y="1.6" width="124.8" height="124.8" rx="26.6"
          fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.6"/>

    <!-- 垃圾桶：提手 / 盖 / 桶身，槽位用 mask 挖空 -->
    <g filter="url(#binShadow)">
      <g mask="url(#binSlots)" fill="#ffffff">
        <rect x="50.2" y="18.6" width="26.4" height="9.6" rx="4.8"/>
        <rect x="29.2" y="31.4" width="69.6" height="10.6" rx="5.3"/>
        <path d="M35.6 46.4 L93.4 46.4 L89 99 Q88.4 108 80 108 L49 108 Q40.6 108 40 99 Z"/>
      </g>
    </g>
  </svg>

  <!-- 16 用简化版：实心，无槽位/高光/投影，保证小尺寸辨识度 -->
  <svg id="simple" viewBox="0 0 16 16" width="0" height="0" style="display:none">
    <defs>
      <linearGradient id="bgGradS" x1="2" y1="1" x2="14" y2="15" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#19c49b"/>
        <stop offset="1" stop-color="#077258"/>
      </linearGradient>
    </defs>
    <rect width="16" height="16" rx="4" fill="url(#bgGradS)"/>
    <g fill="#ffffff">
      <rect x="3" y="4" width="10" height="2" rx="1"/>
      <path d="M4 7 L12 7 L12 12.6 A1.4 1.4 0 0 1 10.6 14 L5.4 14 A1.4 1.4 0 0 1 4 12.6 Z"/>
    </g>
  </svg>

  <script>
    (function () {
      var size = parseInt(new URLSearchParams(location.search).get('size') || '128', 10);
      var useSimple = size <= 24;
      var keep = document.getElementById(useSimple ? 'simple' : 'detailed');
      var drop = document.getElementById(useSimple ? 'detailed' : 'simple');
      keep.style.display = 'block';
      keep.setAttribute('width', size);
      keep.setAttribute('height', size);
      drop.remove();
      document.body.style.width = size + 'px';
      document.body.style.height = size + 'px';
    })();
  </script>
</body>
</html>
