<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear Chats — AI 聊天批量删除</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
        </svg>
      </div>
      <div class="heading">
        <h1>Clear Chats <span class="version" id="version"></span></h1>
        <p>批量清理 AI 聊天会话</p>
      </div>
      <a class="repo-link" href="https://github.com/island-369/clear-chats"
         target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="打开 GitHub 仓库">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
            1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
            1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0
            3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012
            8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
      </a>
    </header>

    <main class="main">
      <section class="status-card" id="page-card" data-state="checking" aria-live="polite">
        <span class="page-dot" aria-hidden="true"></span>
        <strong id="page-title">正在检测当前页面…</strong>
      </section>

      <button class="primary" id="open-panel" type="button" disabled>
        <span id="action-label">打开删除面板</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10h11"/>
          <path d="m10.5 5.5 4.5 4.5-4.5 4.5"/>
        </svg>
      </button>

      <p class="hint" id="hint" hidden></p>
    </main>

    <footer class="footer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 1.8 13 3.6v3.7c0 3.1-2 5.4-5 6.5-3-1.1-5-3.4-5-6.5V3.6L8 1.8Z"/>
        <path d="m5.8 7.7 1.5 1.5 3-3.2"/>
      </svg>
      <span>纯本地运行 · 不上传数据</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
